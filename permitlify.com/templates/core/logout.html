<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Signed Out — Permitlify</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --pr:#1d4ed8;--ac:#059669;
  --grad:linear-gradient(135deg,#1d4ed8 0%,#059669 100%);
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --bg:#f8fafc;--bdr:rgba(0,0,0,.08);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased;}
.wrap{text-align:center;max-width:420px;padding:32px 24px;}
.icon-ring{width:72px;height:72px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 24px rgba(29,78,216,.28);}
.icon-ring svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;}
.brand{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:28px;font-weight:800;color:var(--tx);letter-spacing:-.5px;margin-bottom:10px;}
p{font-size:15px;color:var(--tx2);line-height:1.7;margin-bottom:32px;}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;background:var(--grad);color:#fff;text-decoration:none;border-radius:11px;font-size:14.5px;font-weight:700;box-shadow:0 4px 16px rgba(29,78,216,.3);transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#fff;color:var(--tx2);text-decoration:none;border-radius:11px;font-size:14px;font-weight:600;border:1px solid var(--bdr);margin-top:12px;transition:all .2s;font-family:'DM Sans',sans-serif;}
.btn-secondary:hover{border-color:var(--pr);color:var(--pr);}
.divider{width:40px;height:2px;background:var(--grad);border-radius:2px;margin:28px auto;}
.tip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon-ring">
    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  </div>
  <div class="brand">Permitlify</div>
  <h1>You've been signed out</h1>
  <p>Your session has ended. All your permit data and hot leads will be waiting when you return.</p>
  <div>
    <a href="{% url 'login' %}" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Sign Back In
    </a>
  </div>
  <div>
    <a href="{% url 'index' %}" class="btn-secondary">
      ← Back to Permitlify.com
    </a>
  </div>
  <div class="divider"></div>
  <div class="tip">Free trial on every plan &nbsp;·&nbsp; Card required to start &nbsp;·&nbsp; Cancel anytime</div>
</div>
</body>
</html>
